name: Check

# Общие проверки идут сразу, на каждый push и pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Клонировать шаблоны
        run: mise run clone
      - name: Проверить правила и контракт
        run: mise run check
