# Инструменты, клоны и задачи метарепозитория. Одна команда ставит хуки,
# остальное mise доставляет сам перед запуском задачи.
#
#   mise run setup
#
# Версии здесь latest, а точные версии и контрольные суммы лежат в mise.lock.
# Обновление идёт командой `mise lock --bump`, после неё проверьте `mise run check`.

# Старше этой версии не работают [doctor.checks] и [bootstrap.repos].
min_version = "2026.9.6"

[tools]
"aqua:ast-grep/ast-grep" = "latest"
hk = "latest"
pkl = "latest"

# Проверки текстов и настроек агента, источник выбора dev-guardrails.
rumdl = "latest"
typos = "latest"
jactionlint = "latest"
shellcheck = "latest"
"github:agent-sh/agnix" = "latest"

# Клоны шаблонов. Адрес это весь манифест, mise не трогает правки в клонах.
[bootstrap.repos]
"repos/nodejs-package" = { url = "https://github.com/hexlet-boilerplates/nodejs-package.git" }
"repos/typescript-package" = { url = "https://github.com/hexlet-boilerplates/typescript-package.git" }
"repos/vite-package" = { url = "https://github.com/hexlet-boilerplates/vite-package.git" }
"repos/fastify-api-application" = { url = "https://github.com/hexlet-boilerplates/fastify-api-application.git" }
"repos/java-package" = { url = "https://github.com/hexlet-boilerplates/java-package.git" }
"repos/sicp-racket" = { url = "https://github.com/hexlet-boilerplates/sicp-racket.git" }
"repos/fastify-nodejs-application" = { url = "https://github.com/hexlet-boilerplates/fastify-nodejs-application.git" }
"repos/php-package" = { url = "https://github.com/hexlet-boilerplates/php-package.git" }
"repos/csharp-package" = { url = "https://github.com/hexlet-boilerplates/csharp-package.git" }
"repos/spring-boot-application" = { url = "https://github.com/hexlet-boilerplates/spring-boot-application.git" }
"repos/ruby-gem" = { url = "https://github.com/hexlet-boilerplates/ruby-gem.git" }
"repos/html-boilerplate" = { url = "https://github.com/hexlet-boilerplates/html-boilerplate.git" }
"repos/vagrant-ansible" = { url = "https://github.com/hexlet-boilerplates/vagrant-ansible.git" }
"repos/python-package" = { url = "https://github.com/hexlet-boilerplates/python-package.git" }
"repos/gopackage" = { url = "https://github.com/hexlet-boilerplates/gopackage.git" }
"repos/data_analytics_package" = { url = "https://github.com/hexlet-boilerplates/data_analytics_package.git" }
"repos/ansible" = { url = "https://github.com/hexlet-boilerplates/ansible.git" }

# Проверка окружения, запускается командой `mise doctor project`.
[doctor.checks.clones]
description = "Клоны лежат в repos/"
run = "ls repos/*/.git >/dev/null"
hint = "Выполните `mise run clone`."

# Задачи лежат файлами в mise-tasks/ (см. mise-tasks/README.md).
